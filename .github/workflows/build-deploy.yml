name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick and exiftool
        run: sudo apt-get update && sudo apt-get install -y imagemagick libimage-exiftool-perl

      - name: Build gallery
        run: ./build_gallery.sh ./Source ./Web

      - name: Validate JSON
        run: |
          python3 -m json.tool Web/gallery.json > /dev/null
          python3 -m json.tool Web/stats.json > /dev/null

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: Web
          retention-days: 14

# Деплой на GitHub Pages включается так:
# 1. Settings → Pages → Build and deployment → Source: GitHub Actions
# 2. Добавить job deploy с actions/configure-pages@v5 → upload-pages-artifact@v3 → actions/deploy-pages@v4
